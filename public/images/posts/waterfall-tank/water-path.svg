<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" font-family="sans-serif">
  <title>폭포 어항 물길 계획</title>
  <desc>물속 펌프에서 나온 호스가 Y자로 나뉘어 한쪽은 폭포 돌 꼭대기로, 다른 쪽은 조절 밸브를 거쳐 물속으로 돌아간다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5"/></marker>
  </defs>
  <rect width="400" height="290" fill="#ffffff"/>
  <rect x="30" y="140" width="220" height="100" fill="#85B7EB" opacity="0.35"/>
  <rect x="30" y="222" width="220" height="18" fill="#854F0B" opacity="0.8"/>
  <polygon points="45,222 58,150 88,112 120,94 160,96 176,140 182,222" fill="#888780"/>
  <path d="M160 98 Q170 115 172 135 Q174 155 178 175" fill="none" stroke="#378ADD" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="190" y="182" width="48" height="40" rx="3" fill="#444441"/>
  <path d="M212 182 L212 78 L156 78 L156 90" fill="none" stroke="#378ADD" stroke-width="4" stroke-linejoin="round"/>
  <path d="M212 160 L238 160 L238 174" fill="none" stroke="#378ADD" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/>
  <circle cx="226" cy="160" r="5" fill="#D85A30"/>
  <circle cx="212" cy="160" r="3.5" fill="#0C447C"/>
  <rect x="30" y="40" width="220" height="200" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <line x1="26" y1="40" x2="254" y2="40" stroke="#5F5E5A" stroke-width="2"/>
  <g stroke="#888780" stroke-width="0.6" stroke-dasharray="3 2">
    <line x1="216" y1="78" x2="256" y2="78"/>
    <line x1="246" y1="140" x2="256" y2="124"/>
    <line x1="214" y1="157" x2="256" y2="146"/>
    <line x1="231" y1="162" x2="256" y2="170"/>
    <line x1="238" y1="208" x2="256" y2="210"/>
    <line x1="100" y1="246" x2="100" y2="256"/>
  </g>
  <g font-size="12" fill="#444441" dominant-baseline="central">
    <text x="262" y="78">주 호스 → 폭포</text>
    <text x="262" y="122">수위 절반 이하</text>
    <text x="262" y="146">Y자 분기</text>
    <text x="262" y="170">조절 밸브</text>
    <text x="262" y="186" fill="#5F5E5A">열수록 폭포 약해짐</text>
    <text x="262" y="210">펌프 (물속)</text>
    <text x="100" y="268" text-anchor="middle">화산석·편석 폭포</text>
  </g>
</svg>
